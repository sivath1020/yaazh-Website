# Security Headers for SEO and Browser Hardening
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss:;" always;

location = /index.html { return 301 /$is_args$args; }
location = / {
    # Serve the file in this location so the index module cannot redirect to /index.html.
    try_files /index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss:;" always;
}
location ~ ^/brochures?/?$ { return 301 /services$is_args$args; }
location ~ ^/partners/?$ { return 301 /$is_args$args; }
location ~ ^/(services|about|work|work/aspire-holidays|work/vibhu-travel|contact|careers|digital-marketing-company-coimbatore|website-development-coimbatore|software-development-coimbatore)\.html$ {
    return 301 /$1$is_args$args;
}
location ~ ^/(services|about|work|work/aspire-holidays|work/vibhu-travel|contact|careers|digital-marketing-company-coimbatore|website-development-coimbatore|software-development-coimbatore)/+$ {
    return 301 /$1$is_args$args;
}

location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
}
location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
}

# Static Asset Performance Caching
location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|webp)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss:;" always;
}

location / {
    # Each real route is pre-rendered as e.g. /about.html.
    # Do not use /index.html as a fallback: it creates duplicate pages and soft 404s.
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; connect-src 'self' https: wss:;" always;
}
error_page 404 /404.html;
location = /404.html { internal; }
